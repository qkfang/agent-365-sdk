services:
  agentid-sidecar:
    image: mcr.microsoft.com/entra-sdk/auth-sidecar:1.0.0-azurelinux3.0-distroless
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      ASPNETCORE_URLS: http://+:5000
      AzureAd__Instance: https://login.microsoftonline.com/
      AzureAd__TenantId: ${ENTRA_TENANT_ID}
      AzureAd__ClientId: ${AGENT_IDENTITY_BLUEPRINT_CLIENT_ID}
      AzureAd__ClientCredentials__0__SourceType: ClientSecret
      AzureAd__ClientCredentials__0__ClientSecret: ${AGENT_IDENTITY_BLUEPRINT_CLIENT_SECRET}
      DownstreamApis__Toolbox__BaseUrl: https://ai.azure.com
      DownstreamApis__Toolbox__Scopes: https://ai.azure.com/.default
      DownstreamApis__Toolbox__RequestAppToken: "true"